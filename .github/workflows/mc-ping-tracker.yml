name: Minecraft Ping Tracker

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this by a few minutes under load.
    # Cron is always in UTC.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed so the workflow can commit the updated CSV back

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install mcstatus

      - name: Ping server
        # Replace with your server address, or store it in a repo Variable/Secret
        # (Settings > Secrets and variables > Actions) and reference it as
        # ${{ vars.MC_SERVER_ADDRESS }} instead of hardcoding it here.
        run: python scripts/ping_server.py "mc.originsrebirth.com"

      - name: Commit and push updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: log ping result"
          file_pattern: "data/pings.csv"
